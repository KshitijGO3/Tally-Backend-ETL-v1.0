[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "o3-intel-suite"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0.30",
    "boto3>=1.40",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "ollama>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",           # for FastAPI TestClient
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
backend-etl = "backend_ETL.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"frontend_dashboard" = [
    "templates/**/*",
    "static/**/*",
]